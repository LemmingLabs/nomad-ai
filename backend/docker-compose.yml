name: nomadai

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nomadai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    working_dir: /app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app:Z
    ports:
      - "127.0.0.1:${APP_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/nomadai

volumes:
  postgres_data:
