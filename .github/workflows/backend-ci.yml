name: Backend CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nomadai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nomadai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_NAME: NomadAI Backend
      DEBUG: 'false'
      POSTGRES_DB: nomadai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/nomadai
      JWT_SECRET_KEY: ci-only-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: '60'
      GOOGLE_MAPS_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check Python code
        run: python -m ruff check app
      - name: Check migrations
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest -q
