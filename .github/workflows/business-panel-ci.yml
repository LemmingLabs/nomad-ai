name: Business panel CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'businessPanel/**'
      - '.github/workflows/business-panel-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: businessPanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: businessPanel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
